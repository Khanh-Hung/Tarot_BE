server:
  port: ${PORT:8080}

spring:
  application:
    name: oracle-tarot-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    identity:
      url: ${SPRING_DATASOURCE_IDENTITY_URL:}
      username: ${SPRING_DATASOURCE_IDENTITY_USERNAME:}
      password: ${SPRING_DATASOURCE_IDENTITY_PASSWORD:}
      driver-class-name: org.postgresql.Driver
    core:
      url: ${SPRING_DATASOURCE_CORE_URL:}
      username: ${SPRING_DATASOURCE_CORE_USERNAME:}
      password: ${SPRING_DATASOURCE_CORE_PASSWORD:}
      driver-class-name: org.postgresql.Driver

# Cấu hình Google Gemini AI
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-lite-latest}

# Cấu hình Bảo mật JWT
application:
  security:
    jwt:
      secret-key: oracle-tarot-super-secret-key-256-bits-minimum-required-for-hmac-sha-algorithm-security
      expiration-ms: 604800000

# Swagger OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html