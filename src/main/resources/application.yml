server:
  port: ${PORT:8080}

spring:
  application:
    name: oracle-tarot-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    core:
      url: ${SPRING_DATASOURCE_CORE_URL:}
      username: ${SPRING_DATASOURCE_CORE_USERNAME:}
      password: ${SPRING_DATASOURCE_CORE_PASSWORD:}
      driver-class-name: org.postgresql.Driver

# Cấu hình Account Service (.NET Microservice)
account-service:
  base-url: ${ACCOUNT_SERVICE_BASE_URL:}
  timeout-ms: ${ACCOUNT_SERVICE_TIMEOUT_MS:5000}

# Cấu hình Google Gemini AI
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-lite-latest}

# Cấu hình Bảo mật JWT
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:}

# Swagger OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html